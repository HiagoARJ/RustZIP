[package]
name = "rustzip-app"
description = "RustZIP: compactador de arquivos (Tauri 2 + interface React em ui/)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "RustZIP"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
rustzip-core = { path = "../crates/core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-dialog = "2.8.4"
# Primeiro plugin: uma segunda execução (menu do Explorer) só repassa os argumentos.
tauri-plugin-single-instance = "2.5.5"
base64 = "0.22"
png = "0.18"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Mapi",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
