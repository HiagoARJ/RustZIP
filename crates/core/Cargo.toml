[package]
name = "rustzip-core"
description = "Motor de arquivos compactados do RustZIP: ZIP, 7z, RAR (leitura), TAR e compressores de fluxo"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
zip = { version = "9.8.1", default-features = false, features = ["aes-crypto", "bzip2", "deflate", "deflate64", "lzma", "xz", "zstd", "time", "deflate-zopfli", "ppmd"] }
sevenz-rust2 = { version = "0.25.0", features = ["compress", "aes256", "util"] }
unrar = "0.5.8"
tar = "0.4.46"
liblzma = { version = "0.4.9", features = ["parallel", "static"] }
zstd = { version = "0.14.4", features = ["zstdmt"] }
bzip2 = "0.6.1"
lz4_flex = "0.14.2"
brotli = "9.1.3"
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
rayon = "1.12.0"
walkdir = "2.5.0"
crc32fast = "1.5.5"
thiserror = "2.0.21"
tempfile = "3.27.0"
serde = { version = "1.0.228", features = ["derive"] }
time = { version = "0.3", features = ["local-offset"] }
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_Foundation"] }

[dev-dependencies]
walkdir = "2.5.0"
